[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btruth"
version = "0.5.0"
description = "building-truth v3: the vessel (SQLite) and the entrance (readers, intake) for drawings and documents"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
btruth = "btruth.cli:main"

[tool.setuptools.packages.find]
include = ["btruth*"]

[tool.setuptools.package-data]
btruth = ["defaults/*.csv", "defaults/*/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
